        429+Retry-After(-32002)，仅业务端点 401 计数，成功请求不计数。复跑 A4 重写块（test-http.js
        L276-313）7/7（同键 8 次 401、键级 429+Retry-After、键级封禁不影响正确 Token、跨键累计封整 IP 含正确
        Token、到期自动解除）+ V3 豁免网段 10 次全 401 永不 429；node scripts/check-v04.mjs 7/7
        通过（含封禁期内请求不延长）。
