acceptance:
  - id: A1
    source: brief.md
    text: A1（向后兼容）：未配置 `auth` 段、仅设置 `SSH_MCP_TOKEN` 的部署升级后行为不变——正确 Token 可正常调用，缺失/错误
      Token 返回 401；完全不设置任何凭据时 HTTP 模式拒绝启动。
    result: passed
    reason:
      text: 独立复跑 node test-http.js 确认：仅 SSH_MCP_TOKEN 部署错误 Token 401/正确 Token
        可用，无任何凭据时非零退出并打印拒绝启动（server.js:275-281）。
      truncated: false
  - id: A2
    source: brief.md
    text: A2（多 Token 与过期）：配置 Token A（有效）与 Token B（`expiresAt` 已过）：A 可调用全部 4 个工具；B 返回
      401；服务端日志/审计记录能区分 A 与 B 的身份。
    result: passed
    reason:
      text: 有效 Token 调用成功、expiresAt 已过与 disabled 均 401，审计按 tokenId=alice/hmac
        与失败指纹区分身份（auth.js:145-151）。
      truncated: false
  - id: A3
    source: brief.md
    text: A3（HMAC 自动轮换）：用 `scripts/derive-token.js` 由 master secret 推导当前桶 Token
      可通过鉴权；前一桶（宽容窗内）可通过；更早桶返回 401；篡改 Token 中桶字段或 hex 部分返回 401。
    result: passed
    reason:
      text: derive-token.js CLI 推导当前桶/±1 宽容桶通过、cur-2 越界与篡改 hex 401，--at 输出与 auth.js
        库函数逐字节一致（auth.js:129-140）。
      truncated: false
  - id: A4
    source: brief.md
    text: A4（防爆破）：同一来源 IP 在窗口内连续达到失败阈值（默认 10 次/60 秒）后，后续请求返回 429 +
      `Retry-After`，封禁期（默认 10 分钟）内即使携带正确 Token 也返回 429；封禁期结束后恢复。
    result: passed
    reason:
      text: 失败达阈值后 429+Retry-After、封禁期正确 Token
        同拒、到期自动解除（server.js:305-316，auth.js:157-187）。
      truncated: false
  - id: A5
    source: brief.md
    text: A5（审计日志）：显式开启 `audit.enabled` 后，每次 `/mcp` 工具调用（成功或失败）与每次鉴权失败尝试，都在
      `audit-YYYY-MM-DD.log` 产生一条 JSONL 记录，包含时间、来源 IP、Token 身份（鉴权失败标记 invalid +
      指纹前 8 位）、工具名、命令/路径全文、结果 ok/error；`/healthz` 与 429 拒绝不产生审计记录。
    result: passed
    reason:
      text: 审计 JSONL 完整、鉴权失败 9/9 条、429 与 /healthz 零记录、失败仅记 8 位指纹、无 Token 原值与
        content_base64（auth.js:191-219）。
      truncated: false
  - id: A6
    source: brief.md
    text: A6（信息不泄露）：鉴权失败响应统一为 401 `unauthorized`，无法从响应区分"Token 不存在 / 已过期 / 已禁用 /
      HMAC 桶越界"。
    result: passed
    reason:
      text: 四种失败响应体逐一比对完全一致，唯一 401 出口统一 code=-32001 unauthorized（server.js:334-336）。
      truncated: false
  - id: A7
    source: brief.md
    text: A7（审计默认关闭）：未配置 `audit` 或 `audit.enabled=false` 时不创建审计目录、不写任何审计文件，其余功能不受影响。
    result: passed
    reason:
      text: audit.enabled=false 时空实现不做 mkdir，实测无任何审计目录/文件产生（auth.js:200）。
      truncated: false
